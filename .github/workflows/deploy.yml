name: Sentinel System CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Go kurulumu
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Testler
      run: go test ./...

    - name: Go servislerini derle
      run: |
        go build -o /tmp/analyst ./cmd/analyst
        go build -o /tmp/commander ./cmd/commander
        go build -o /tmp/scout ./cmd/scout

    - name: Docker Hub Giriş
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # --- 1. KOMUTANI (COMMANDER) YÜKLE ---
    - name: Build & Push (Commander)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.commander
        push: true
        # DİKKAT: tags kısmını kendi kullanıcına göre düzenle
        tags: cagrisaltik/sentinel-commander:latest

    # --- 2. AJANI (SCOUT) YÜKLE ---
    - name: Build & Push (Scout)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.scout
        push: true
        # DİKKAT: tags kısmını kendi kullanıcına göre düzenle
        tags: cagrisaltik/sentinel-scout:latest

    # --- 3. Analyst'i  YÜKLE ---
    - name: Build & Push (Analyst)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.analyst
        push: true
        # DİKKAT: tags kısmını kendi kullanıcına göre düzenle
        tags: cagrisaltik/sentinel-analyst:latest
