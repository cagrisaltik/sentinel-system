name: Sentinel Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Docker Hub Giriş
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # BURASI ÖNEMLİ: Scout (Ajan) için Build alıyoruz
    - name: Build & Push (Scout)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.scout
        push: true
        tags: cagrisaltik/sentinel-scout:latest