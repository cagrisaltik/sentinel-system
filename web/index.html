<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel | Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #09090b; --card-bg: rgba(24, 24, 27, 0.6); --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #3b82f6; --success-color: #10b981; --danger-color: #ef4444;
            --text-main: #e4e4e7; --text-muted: #a1a1aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-color); background-image: radial-gradient(circle at top right, #1e1b4b 0%, transparent 40%); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 2rem; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .brand { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; gap: 10px; display: flex; align-items: center; }
        .brand i { color: var(--accent-color); }

        /* FİLTRE BUTONLARI */
        .filter-group { display: flex; gap: 5px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
        .filter-btn { background: transparent; color: var(--text-muted); padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; }
        .filter-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .filter-btn.active { background: var(--accent-color); color: white; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; }
        .stat-card { gap: 10px; }
        .stat-value { font-size: 2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .stat-title { color: var(--text-muted); font-size: 0.9rem; }

        /* GRAFİK DÜZENİ */
        .main-chart-container { grid-column: span 3; grid-row: span 2; min-height: 400px; position: relative; }
        .pie-chart-container { grid-column: span 1; min-height: 250px; position: relative; display: flex; align-items: center; justify-content: center; }
        .chart-wrapper { position: relative; height: 100%; width: 100%; flex-grow: 1; }

        .table-container { grid-column: span 1; grid-row: span 2; overflow: hidden; }
        .table-wrapper { overflow-y: auto; margin-top: 10px; height: 100%; }

        /* Görev Yöneticisi ve Diğerleri */
        .task-manager { grid-column: span 4; display: flex; flex-direction: row; gap: 20px; align-items: flex-start; }
        .task-form { flex: 1; display: flex; gap: 10px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; width: 100%; }
        .task-list { flex: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input, select { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 6px; flex: 1; font-family: 'JetBrains Mono'; outline: none; }
        button { background: var(--accent-color); color: white; border: none; padding: 0 25px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .task-item { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: var(--text-muted); padding: 10px; border-bottom: 1px solid var(--border-color); background: #161b22; }
        td { padding: 10px; border-bottom: 1px solid var(--border-color); font-family: 'JetBrains Mono'; }
        .status-ok { color: var(--success-color); } .status-err { color: var(--danger-color); }
        .sys-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-right: 4px; background: rgba(255,255,255,0.1); color: #ccc; }
        .sys-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .sys-crit { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } .main-chart-container, .pie-chart-container, .table-container, .task-manager { grid-column: span 1; } .task-manager { flex-direction: column; } }
    </style>
</head>
<body>
    <header>
        <div class="brand"><i class="fa-solid fa-shield-halved"></i> SENTINEL <span style="font-weight: 300; opacity: 0.6;">ANALYTICS</span></div>
        
        <div class="filter-group">
            <button class="filter-btn active" onclick="setMode('live')">🔴 Canlı</button>
            <button class="filter-btn" onclick="setMode('1')">1 Saat</button>
            <button class="filter-btn" onclick="setMode('6')">6 Saat</button>
            <button class="filter-btn" onclick="setMode('24')">24 Saat</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card stat-card"> <span class="stat-title">Toplam Kayıt</span> <span class="stat-value" id="totalScans">0</span> </div>
        <div class="card stat-card"> <span class="stat-title">Ort. Gecikme</span> <span class="stat-value" id="avgLatency">0ms</span> </div>
        <div class="card stat-card"> <span class="stat-title">Sistem Sağlığı</span> <span class="stat-value" id="systemHealth" style="color: var(--success-color);">%100</span> </div>
        <div class="card stat-card"> <span class="stat-title">Canlı Ajanlar</span> <span class="stat-value" id="activeAgents">0</span> </div>

        <div class="card task-manager">
            <div class="task-form">
                <select id="targetAgent"> <option value="">Ajan Yükleniyor...</option> </select>
                <input type="text" id="targetUrl" placeholder="Hedef (Örn: 1.1.1.1:53 veya google.com)">
                <button onclick="addTask()">+ Ekle</button>
            </div>
            <div class="task-list" id="taskList"></div>
        </div>

        <div class="card main-chart-container">
            <h3 style="margin-bottom: 15px;">📊 Gecikme Analizi</h3>
            <div class="chart-wrapper"><canvas id="mainChart"></canvas></div>
        </div>

        <div class="card pie-chart-container">
            <h3 style="position: absolute; top: 15px; left: 15px; margin: 0; font-size: 1rem;">Uptime Oranı</h3>
            <div style="height: 180px; width: 180px;">
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <div class="card table-container">
            <h3 style="margin-bottom: 10px;">📋 Kayıtlar</h3>
            <div class="table-wrapper">
                <table id="logTable">
                    <thead><tr><th>Ajan</th><th>Hedef</th><th>Durum</th><th>Ms</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

   <script>
        // --- AYARLAR VE DEĞİŞKENLER ---
        let currentMode = 'live'; 
        let liveInterval = null;

        // --- BUTON İŞLEMLERİ ---
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'live') {
                updateDashboard();
                if (!liveInterval) liveInterval = setInterval(updateDashboard, 2000);
            } else {
                if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
                fetchHistory(mode);
            }
        }

        // --- GRAFİK KURULUMLARI ---
        const ctx = document.getElementById('mainChart').getContext('2d');
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)'); 
        gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');
        
        const mainChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Gecikme (ms)', data: [], borderColor: '#3b82f6', backgroundColor: gradient, fill: true, tension: 0.3, pointRadius: 2 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                animation: true, 
                plugins: { legend: { display: false } }, 
                scales: { 
                    x: { ticks: { color: '#666', maxTicksLimit: 8 }, grid: { display: false } }, 
                    y: { beginAtZero: true, max: 1000, grid: { color: '#333' } } 
                } 
            }
        });

        const pieCtx = document.getElementById('pieChart').getContext('2d');
        const pieChart = new Chart(pieCtx, {
            type: 'doughnut',
            data: {
                labels: ['Başarılı', 'Hatalı'],
                datasets: [{ data: [100, 0], backgroundColor: ['#10b981', '#ef4444'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '70%' }
        });

        // --- VERİ ÇEKME ---
        async function fetchHistory(hours) {
            try {
                const res = await fetch(`/api/history?hours=${hours}`);
                const data = await res.json();
                renderData(data);
            } catch (e) { console.error(e); }
        }

        async function updateDashboard() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                renderData(data);
            } catch (e) {}
        }

        // --- ANA RENDER FONKSİYONU ---
        function renderData(data) {
            if (!data || data.length === 0) {
                // Veri yoksa grafikleri sıfırla
                mainChart.data.labels = [];
                mainChart.data.datasets[0].data = [];
                mainChart.update();
                return;
            }

            // 1. İstatistik Hesaplama
            document.getElementById('totalScans').innerText = data.length;
            let totalLatency = 0;
            let successCount = 0;
            
            // Canlı Ajan Hesabı (Son 45 saniye)
            const now = new Date();
            const activeSet = new Set();

            data.forEach(d => {
                totalLatency += parseInt(d.latency);
                if(d.status === 200) successCount++;
                
                // UTC zaman farkını düzeltmek için
                const logTime = new Date(d.created_at);
                if ((now - logTime) < 45000) activeSet.add(d.agent);
            });

            // İstatistikleri Ekrana Bas
            const avg = data.length ? Math.round(totalLatency / data.length) : 0;
            document.getElementById('avgLatency').innerText = avg + "ms";

            const successRate = data.length ? Math.round((successCount / data.length) * 100) : 0;
            const healthEl = document.getElementById('systemHealth');
            healthEl.innerText = `%${successRate}`;
            healthEl.style.color = successRate === 100 ? '#10b981' : (successRate > 50 ? '#f59e0b' : '#ef4444');

            if (currentMode === 'live') {
                document.getElementById('activeAgents').innerText = activeSet.size;
            }

            // 2. Pasta Grafik
            pieChart.data.datasets[0].data = [successCount, data.length - successCount];
            pieChart.update();

            // 3. Tablo (Veriler API'den ID DESC yani Yeniden Eskiye geliyor)
            // Tabloda en yeniler üstte kalsın, dokunmuyoruz.
            const tableBody = document.querySelector("#logTable tbody");
            tableBody.innerHTML = "";
            data.slice(0, 10).forEach(log => {
                const statusClass = log.status === 200 ? 'status-ok' : 'status-err';
                let cpuClass = log.cpu > 80 ? 'sys-crit' : (log.cpu > 50 ? 'sys-warn' : '');
                let ramClass = log.ram > 80 ? 'sys-crit' : (log.ram > 60 ? 'sys-warn' : '');
                
                tableBody.innerHTML += `<tr>
                    <td>
                        <div style="font-weight:bold; color:#60a5fa; margin-bottom:4px;">${log.agent}</div>
                        <div><span class="sys-badge ${cpuClass}">CPU %${Math.round(log.cpu||0)}</span><span class="sys-badge ${ramClass}">RAM %${Math.round(log.ram||0)}</span></div>
                    </td>
                    <td style="color:#a1a1aa; font-size:0.8rem;">${log.target}</td>
                    <td class="${statusClass}">${log.status}</td>
                    <td>${log.latency}</td>
                </tr>`;
            });

            // 4. Çizgi Grafik (DÜZELTME BURADA)
            // Grafik zaman çizelgesidir. Solda ESKİ, Sağda YENİ olmalı.
            // API bize [Yeni, Orta, Eski] veriyor.
            // Biz bunu [Eski, Orta, Yeni] yapmalıyız -> .reverse()
            
            // Orijinal diziyi bozmamak için kopyasını alıp ters çeviriyoruz
            const chartData = [...data].reverse(); 
            
            // Eğer veri çok fazlaysa grafiği boğmamak için son 50 tanesini alalım (History modunda hepsi, Live modda son 50)
            const dataToShow = currentMode === 'live' ? chartData.slice(-50) : chartData;

            mainChart.data.labels = dataToShow.map(d => {
                const date = new Date(d.created_at);
                // Saat:Dakika formatı
                return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
            });
            mainChart.data.datasets[0].data = dataToShow.map(d => parseInt(d.latency));
            mainChart.update();
        }

        // --- TASK & AGENT FONKSİYONLARI ---
        async function fetchActiveAgents() {
            try {
                const res = await fetch('/api/agents');
                const agents = await res.json();
                const select = document.getElementById('targetAgent');
                if (agents.length === 0) { select.innerHTML = '<option value="">⚠️ Aktif Ajan Yok</option>'; return; }
                const current = select.value;
                select.innerHTML = '';
                agents.forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent; option.innerText = `🔵 ${agent}`;
                    select.appendChild(option);
                });
                if(current && agents.includes(current)) select.value = current;
            } catch(e) {}
        }
        setInterval(fetchActiveAgents, 3000); fetchActiveAgents();

        async function loadTasks() {
            try {
                const res = await fetch('/api/targets');
                const tasks = await res.json();
                const container = document.getElementById('taskList');
                container.innerHTML = '';
                tasks.forEach(t => {
                    container.innerHTML += `<div class="task-item"><span><b>${t.agent_name}</b> &rarr; ${t.target_url}</span><i class="fa-solid fa-trash" onclick="deleteTask(${t.id})"></i></div>`;
                });
            } catch(e) {}
        }
        async function addTask() {
            const agent = document.getElementById('targetAgent').value;
            const url = document.getElementById('targetUrl').value.trim();
            if(!agent || !url) return alert("Eksik bilgi!");
            await fetch('/api/targets', { method: 'POST', body: JSON.stringify({ agent_name: agent, target_url: url }) });
            document.getElementById('targetUrl').value = ''; loadTasks();
        }
        async function deleteTask(id) { if(confirm('Sil?')) { await fetch(`/api/targets?id=${id}`, { method: 'DELETE' }); loadTasks(); } }
        loadTasks();

        // Başlangıç Modu
        setMode('live');

    </script>
</body>
</html>
