<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS CONTROL | SENTINEL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/login.css">
</head>
<body>

    <div class="grid-bg"></div>
    <div class="overlay"></div>

    <div class="login-container" id="loginCard">
        <h1>SENTINEL</h1>
        <div class="subtitle">SYSTEM ANALYST ACCESS</div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="OPERATOR ID" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="ACCESS KEY" required>
            </div>
            <button type="submit">INITIALIZE</button>
        </form>

        <div id="errorMsg" class="error-msg">ACCESS DENIED: INVALID CREDENTIALS</div>
    </div>

    <div class="status-line">
        <div class="dot"></div> SERVER STATUS: ONLINE
    </div>

<script src="/assets/login.js" defer></script>

</body>
</html>
