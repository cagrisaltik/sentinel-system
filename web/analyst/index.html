<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel | Business Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="/assets/apexcharts.min.js"></script>
    <script src="/assets/gridjs.min.js"></script>
    <link href="/assets/gridjs.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Sentinel Analyst</h1>
            <div>
                <select id="agentSelect">
                    <option value="">Tüm Ajanlar</option>
                </select>
                <select id="timeSelect">
                    <option value="hour">Saat Bazlı</option>
                    <option value="day">Gün Bazlı</option>
                </select>
            </div>
            <button class="logout-button" id="logoutButton" type="button">Logout</button>
        </div>

        <div class="card">
            <h2>Performans Trendi (Gecikme ms)</h2>
            <div id="chart"></div>
        </div>

        <div class="card">
            <h2>Hedef Bazlı Özet (Tableau View)</h2>
            <div id="table"></div>
        </div>
    </div>

    <script src="/assets/dashboard.js" defer></script>
</body>
</html>
